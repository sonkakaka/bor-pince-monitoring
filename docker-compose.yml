version: '3.8'

services:
  # MQTT Broker - üzenetek közvetítője
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bor-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - bor-network

  # Publisher - szimulált szenzor adatait küldi
  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    container_name: bor-publisher
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    restart: unless-stopped
    networks:
      - bor-network

  # Subscriber - fogadja és feldolgozza az adatokat
  subscriber:
    build:
      context: .
      dockerfile: subscriber/Dockerfile
    container_name: bor-subscriber
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - DB_PATH=/data/pince.db
    volumes:
      - ./database/data:/data
    restart: unless-stopped
    networks:
      - bor-network

  node-red:
    image: nodered/node-red:latest
    container_name: bor-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Budapest
    volumes:
      - node-red-data:/data
    depends_on:
      - subscriber
    restart: unless-stopped
    networks:
      - bor-network

volumes:
  mosquitto_data:
  mosquitto_log:
  node-red-data:

networks:
  bor-network:
    driver: bridge