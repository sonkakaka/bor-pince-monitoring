# MQTT listener
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (dashboardhoz)
listener 9001 0.0.0.0
protocol websockets

# Fejlesztéshez: névtelen kapcsolat engedélyezése
allow_anonymous true

# Logolás
log_dest stdout
log_type all
log_timestamp true

# Perzisztencia
persistence true
persistence_location /mosquitto/data/